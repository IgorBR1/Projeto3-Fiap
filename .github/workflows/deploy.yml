name: CD

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Listar arquivos
        run: ls -R
        
      - name: Instalar dependências
        run: npm install
        working-directory: ./backend/post-service

      - name: Build
        run: npm run build || echo "no build"
        working-directory: ./backend/post-service

      - name: Teste
        run: npm test
        working-directory: ./backend/post-service

      - name: Build Docker image
        run: docker build -t my-app ./backend/post-service